name: Validate TCGate database

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_db.py
      - run: python scripts/build_runtime.py
      - run: python scripts/validate_db.py
      - name: Require reproducible runtime outputs
        run: git diff --exit-code -- runtime
