name: Validate TCGate database

on:
  workflow_dispatch:
    inputs:
      promote:
        description: "Promote reviewed staging into production"
        required: true
        default: false
        type: boolean
  pull_request:
  push:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Synchronize official source to staging
        if: github.event_name == 'workflow_dispatch'
        run: python source/sync.py
      - name: Validate staging promotion guards
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/promote_staging.py --check-only
      - name: Promote reviewed staging
        if: github.event_name == 'workflow_dispatch' && inputs.promote
        run: |
          python scripts/promote_staging.py
          python scripts/ingest_assets.py
      - run: python scripts/validate_db.py
      - run: python scripts/test_sync_promotion.py
      - run: python scripts/test_recognition_model.py
      - run: python scripts/test_assets.py
      - run: python scripts/build_runtime.py
      - run: python scripts/validate_db.py
      - run: python scripts/test_recognition_model.py
      - run: python scripts/test_assets.py
      - name: Require reproducible runtime outputs
        run: git diff --exit-code -- runtime
      - name: Commit synchronized state
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/latest
          if [ "${{ inputs.promote }}" = "true" ]; then git add data runtime sources manifest.json db-manifest.json sets.json assets; fi
          git diff --cached --quiet || git commit -m "chore(db): synchronize official Cyberpunk catalog"
          git push
