name: Build or update TCGate database

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python source/sync.py
      - run: python scripts/validate_db.py
      - run: python scripts/build_runtime.py
      - name: Commit refreshed database
        run: |
          git config user.name "tcgate-db-bot"
          git config user.email "tcgate-db-bot@users.noreply.github.com"
          git add data runtime
          if git diff --cached --quiet; then
            echo "No database changes"
          else
            git commit -m "Update TCGate database"
            git push
          fi
